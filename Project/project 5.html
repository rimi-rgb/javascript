<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlimited Color Changer</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 150px;
    transition: background-color 0.5s;
}

button{
    padding: 10px 20px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>Unlimited Color Changer</h1>

<button onclick="startColor()">Start</button>
<button onclick="stopColor()">Stop</button>

<script>

let interval;

function randomColor() {
    let color = "#" + Math.floor(Math.random() * 16777215).toString(16);
    document.body.style.backgroundColor = color;
}

function startColor() {
    interval = setInterval(randomColor, 1000);
}

function stopColor() {
    clearInterval(interval);
    interval = null;
}

</script>

</body>
</html>
